name: Lead bot

on:
  schedule:
    - cron: "0 15 * * 1-5"   # weekdays, 15:00 UTC (8am Pacific)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write              # needed to save leads.csv back to the repo

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run lead bot
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python leadbot.py --max 30
      - name: Build dashboard (README.md)
        run: python dashboard.py
      - name: Save new leads
        run: |
          git config user.name "leadbot"
          git config user.email "leadbot@users.noreply.github.com"
          git add leads.csv README.md
          git diff --cached --quiet || (git commit -m "New leads $(date -u +%F)" && git push)
